name: Test

on:
  push:
    branches:
      - main
  pull_request:
    # labeled/unlabeled: re-run when a test-on-* label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Opt-in extras: dispatch manually on a PR branch (Actions > Run workflow,
  # or `gh workflow run test.yml --ref <branch>`), or add the test-on-mac
  # label to the PR. inputs is empty on push/pull_request, so those run the
  # fast pair unless the label opts in. (test-on-windows is accepted but
  # changes nothing: Windows always runs.)
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS (slow)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in: tick "Also run on macOS" when dispatching
        # manually, or add the test-on-mac label to the PR.
        os: ${{ fromJSON((inputs.macos || contains(github.event.pull_request.labels.*.name, 'test-on-mac')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # All runners have a C toolchain, so -race works everywhere.
      - name: Test
        run: go test -race ./...

  # Single stable check name for the branch ruleset: require only "test".
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        if: needs.test-matrix.result != 'success'
        run: exit 1
