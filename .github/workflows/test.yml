name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux always runs; macOS and Windows are opt-in via the
        # test-on-mac / test-on-windows PR labels.
        os: ${{ fromJSON(format('["ubuntu-latest"{0}{1}]', contains(github.event.pull_request.labels.*.name, 'test-on-windows') && ',"windows-latest"' || '', contains(github.event.pull_request.labels.*.name, 'test-on-mac') && ',"macos-latest"' || '')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # All runners have a C toolchain, so -race works everywhere.
      - name: Test
        run: go test -race ./...

  # Single stable check name for the branch ruleset: require only "test".
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        if: needs.test-matrix.result != 'success'
        run: exit 1
